[platformio]
default_envs = esp32s3

[env]
platform = espressif32
board = 4d_systems_esp32s3_gen4_r8n16
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
build_unflags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=0

[env:esp32s3]
build_src_filter =
  +<main.cpp>

[env:esp32s3_tone_smoke]
build_src_filter =
  +<simple_tone_smoke.cpp>

[env:esp32s3_simple_anc]
build_src_filter =
  +<simple_anc.cpp>

[env:esp32s3_logic_analyzer]
build_src_filter =
  +<logic_analyzer_test.cpp>
